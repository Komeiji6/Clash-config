# ============================================================
# Komeiji6/Clash-config 主配置文件 (适用于 Mihomo / CMFA)
# 配合高通 410 棒子自动测速、落地 IP 分类与纯净度打标使用
# ============================================================

# ==================== 基础设置 ====================
mixed-port: 7890
allow-lan: true
bind-address: "*"
mode: rule
log-level: info
ipv6: false                        # 免费节点大多不支持 IPv6，关闭可防泄露和断流
unified-delay: true                # 统一延迟计算，去除握手额外耗时影响
tcp-concurrent: true               # 开启 TCP 并发连接，提升切节点和首次加载速度
find-process-mode: strict
global-client-fingerprint: chrome  # 伪装 Chrome TLS 指纹，减少被风控概率

profile:
  store-selected: true             # 记住手动选择的策略组节点
  store-fake-ip: true              # 缓存 Fake-IP 映射，减少重启后的连接中断

# ==================== 域名嗅探 (配合 Fake-IP 防止分流失效) ====================
sniffer:
  enable: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

# ==================== DNS 设置 (DoH + Fake-IP) ====================
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "localhost.ptlogin2.qq.com"
    - "+.srv.nintendo.net"
    - "+.stun.playstation.net"
    - "xbox.*.microsoft.com"
    - "+.xboxlive.com"
    - "time.*.com"
    - "time.*.gov"
    - "time.*.edu.cn"
    - "time.*.apple.com"
    - "ntp.*.com"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "connectivitycheck.gstatic.com"
    - "captive.apple.com"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fallback:
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4
      - 0.0.0.0/32

# ==================== 节点订阅源 (对接本仓库 nodes 分支) ====================
proxy-providers:
  free-nodes:
    type: http
    url: "https://cdn.jsdelivr.net/gh/Komeiji6/Clash-config@nodes/proxies.yaml"
    path: ./proxies/free-nodes.yaml
    interval: 3600
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 300

# ==================== 策略组 ====================
proxy-groups:
  # 1. 日常主开关
  - name: PROXY
    type: select
    proxies:
      - 纯净节点
      - 自动选择
      - 香港
      - 日本
      - 新加坡
      - 美国
      - 其他地区
      - DIRECT

  # 2. 兜底开关（默认白名单，需要黑名单时直接点 DIRECT）
  - name: 漏网之鱼
    type: select
    proxies:
      - PROXY
      - DIRECT

  # 3. 质量优选组
  - name: 纯净节点
    type: url-test
    use:
      - free-nodes
    filter: "纯净"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 80

  - name: 自动选择
    type: url-test
    use:
      - free-nodes
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  # 4. 地区自动分组（匹配 410 棒子生成的 "国家代码 | 纯净度 | ..." 格式）
  - name: 香港
    type: url-test
    use:
      - free-nodes
    filter: "^HK\\s*\\|"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: 日本
    type: url-test
    use:
      - free-nodes
    filter: "^JP\\s*\\|"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: 新加坡
    type: url-test
    use:
      - free-nodes
    filter: "^SG\\s*\\|"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: 美国
    type: url-test
    use:
      - free-nodes
    filter: "^US\\s*\\|"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 80

  - name: 其他地区
    type: select
    use:
      - free-nodes
    exclude-filter: "^(HK|JP|SG|US)\\s*\\|"

# ==================== 规则集 (Loyalsoldier/clash-rules 白名单精简版) ====================
rule-providers:
  reject:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/reject.txt"
    path: ./ruleset/reject.yaml
    interval: 86400

  icloud:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/icloud.txt"
    path: ./ruleset/icloud.yaml
    interval: 86400

  apple:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/apple.txt"
    path: ./ruleset/apple.yaml
    interval: 86400

  google:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/google.txt"
    path: ./ruleset/google.yaml
    interval: 86400

  proxy:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/proxy.txt"
    path: ./ruleset/proxy.yaml
    interval: 86400

  direct:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/direct.txt"
    path: ./ruleset/direct.yaml
    interval: 86400

  private:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/private.txt"
    path: ./ruleset/private.yaml
    interval: 86400

  telegramcidr:
    type: http
    behavior: ipcidr
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/telegramcidr.txt"
    path: ./ruleset/telegramcidr.yaml
    interval: 86400

  cncidr:
    type: http
    behavior: ipcidr
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/cncidr.txt"
    path: ./ruleset/cncidr.yaml
    interval: 86400

  lancidr:
    type: http
    behavior: ipcidr
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/lancidr.txt"
    path: ./ruleset/lancidr.yaml
    interval: 86400

  applications:
    type: http
    behavior: classical
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/applications.txt"
    path: ./ruleset/applications.yaml
    interval: 86400

# ==================== 分流规则 ====================
rules:
  # 1. 本地应用、面板与局域网直连
  - RULE-SET,applications,DIRECT
  - DOMAIN,clash.razord.top,DIRECT
  - DOMAIN,yacd.haishan.me,DIRECT
  - RULE-SET,private,DIRECT

  # 2. 广告拦截
  - RULE-SET,reject,REJECT

  # 3. 苹果国内直连
  - RULE-SET,icloud,DIRECT
  - RULE-SET,apple,DIRECT

  # 4. 明确代理域名
  - RULE-SET,google,PROXY
  - RULE-SET,proxy,PROXY

  # 5. 明确直连域名
  - RULE-SET,direct,DIRECT

  # 6. IP 规则（加 no-resolve 避免多余 DNS 解析）
  - RULE-SET,lancidr,DIRECT,no-resolve
  - RULE-SET,cncidr,DIRECT,no-resolve
  - RULE-SET,telegramcidr,PROXY,no-resolve
  - GEOIP,LAN,DIRECT,no-resolve
  - GEOIP,CN,DIRECT,no-resolve

  # 7. 兜底
  - MATCH,漏网之鱼
