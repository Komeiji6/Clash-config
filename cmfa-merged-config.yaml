# ==================== 策略组 (无缝直连内嵌节点) ====================
proxy-groups:
  # 1. 日常主开关
  - name: PROXY
    type: select
    proxies:
      - 纯净节点
      - 自动选择
      - 香港
      - 日本
      - 新加坡
      - 美国
      - 其他地区
      - DIRECT

  # 2. 兜底开关
  - name: 漏网之鱼
    type: select
    proxies:
      - PROXY
      - DIRECT

  # 3. 质量优选组
  - name: 纯净节点
    type: url-test
    include-all: true
    filter: "纯净"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 80
    empty-fallback: DIRECT

  - name: 自动选择
    type: url-test
    include-all: true
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    empty-fallback: DIRECT

  # 4. 地区直选组（内嵌备选保底，绝不触发 COMPATIBLE 伪节点）
  - name: 香港
    type: select
    include-all: true
    filter: "^HK\\s*\\|"
    proxies:
      - 自动选择
      - DIRECT

  - name: 日本
    type: select
    include-all: true
    filter: "^JP\\s*\\|"
    proxies:
      - 自动选择
      - DIRECT

  - name: 新加坡
    type: select
    include-all: true
    filter: "^SG\\s*\\|"
    proxies:
      - 自动选择
      - DIRECT

  - name: 美国
    type: select
    include-all: true
    filter: "^US\\s*\\|"
    proxies:
      - 自动选择
      - DIRECT

  - name: 其他地区
    type: select
    include-all: true
    exclude-filter: "^(HK|JP|SG|US)\\s*\\|"
    proxies:
      - 自动选择
      - DIRECT

# ==================== 规则集 (Loyalsoldier/clash-rules 白名单精简版) ====================
rule-providers:
  reject:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/reject.txt"
    path: ./ruleset/reject.yaml
    interval: 86400

