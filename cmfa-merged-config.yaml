# ============================================================
#  全平台 Mihomo (Clash.Meta) 合并配置
#
#  免费节点来源 : 本仓库 nodes 分支 proxies.yaml（每 8 小时经 GitHub Actions
#                从 ClashX-V2Ray-TopFreeProxy 筛选 ≤500ms 存活节点）
#                许可：仅限非商业用途，引用时保留其来源与非商业限制
#  分流规则来源 : Loyalsoldier/clash-rules (GPL-3.0)（每天 06:30 构建）
#
#  兼容核心：mihomo (Clash Meta) —— Clash Verge Rev、Clash Party、
#           FlClash、CMFA、Clash Nyanpasu、OpenClash 等全平台客户端。
# ============================================================

# ---------- 基础 ----------
mixed-port: 7890
allow-lan: false
mode: rule
log-level: warning
ipv6: false
unified-delay: true
tcp-concurrent: true
global-client-fingerprint: chrome

external-controller: 127.0.0.1:9090
# secret: "your_password"        # 给外部面板设置密码，需要时取消注释

profile:
  store-selected: true           # 记住手动选择的节点
  store-fake-ip: true

# ---------- 域名嗅探 ----------
sniffer:
  enable: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]

# ---------- DNS ----------
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "+.local"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "+.market.xiaomi.com"
    - "+.ntp.org"
    - "time.*.com"
    - "ntp.*.com"
  default-nameserver:            # 必须为 IP，用于解析下面的 DoH 域名
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:       # 用于解析节点本身的域名，防止死锁或卡顿
    - 223.5.5.5
    - 119.29.29.29
  nameserver:                    # 国内 DoH，解析国内域名
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  fallback:                      # 国外 DoH，配合 fallback-filter 判定污染
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
  fallback-filter:
    geoip: true
    ipcidr:
      - 240.0.0.0/4

# ============================================================
#  节点提供者（指向本仓库 nodes 分支预筛后的存活节点）
# ============================================================
proxy-providers:
  topfree:
    type: http
    url: "https://raw.githubusercontent.com/Komeiji6/Clash-config/nodes/proxies.yaml"
    interval: 14400               # 每 4 小时拉取一次最新节点
    path: ./providers/topfree.yaml
    proxy: PROXY                  # 走代理拉取 GitHub Raw，无 CDN 缓存延迟
    exclude-type: "http|socks5"   # 排除极不稳定的公开扫描 HTTP/SOCKS 代理
    health-check:
      enable: true
      url: "https://www.gstatic.com/generate_204"
      interval: 1200              # 每 20 分钟测活一次
      timeout: 3000
      lazy: true                  # 仅在用到时测活，省流量
      expected-status: 204        # 剔除只通 TCP 但返回报错/劫持页的节点

# ============================================================
#  分流规则提供者（Loyalsoldier，每日自动更新）
# ============================================================
rule-providers:
  applications:
    type: http
    behavior: classical
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/applications.txt"
    path: ./ruleset/applications.yaml
    interval: 86400
  private:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/private.txt"
    path: ./ruleset/private.yaml
    interval: 86400
  reject:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/reject.txt"
    path: ./ruleset/reject.yaml
    interval: 86400
  icloud:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/icloud.txt"
    path: ./ruleset/icloud.yaml
    interval: 86400
  apple:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/apple.txt"
    path: ./ruleset/apple.yaml
    interval: 86400
  google:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/google.txt"
    path: ./ruleset/google.yaml
    interval: 86400
  proxy:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/proxy.txt"
    path: ./ruleset/proxy.yaml
    interval: 86400
  direct:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/direct.txt"
    path: ./ruleset/direct.yaml
    interval: 86400
  lancidr:
    type: http
    behavior: ipcidr
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/lancidr.txt"
    path: ./ruleset/lancidr.yaml
    interval: 86400
  cncidr:
    type: http
    behavior: ipcidr
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/cncidr.txt"
    path: ./ruleset/cncidr.yaml
    interval: 86400
  telegramcidr:
    type: http
    behavior: ipcidr
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/telegramcidr.txt"
    path: ./ruleset/telegramcidr.yaml
    interval: 86400

# ============================================================
#  策略组
# ============================================================
proxy-groups:
  # 主选择组：默认自动测速，也可手动切换 APAC-AUTO 或任意单节点
  - name: PROXY
    type: select
    use: [topfree]
    proxies: [AUTO, APAC-AUTO, DIRECT]

  # 全部存活节点自动测速（在中国本地网络下挑出真正最快的节点）
  - name: AUTO
    type: url-test
    use: [topfree]
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    timeout: 2500
    tolerance: 50
    lazy: true
    max-failed-times: 2
    expected-status: 204

  # 亚太低延迟自动组（仅保留名称含港/台/日/新/韩的节点，适合追求极低延迟时手动选中）
  - name: APAC-AUTO
    type: url-test
    use: [topfree]
    filter: "(?i)港|hk|hong|台|tw|taiwan|日|jp|japan|新|sg|singapore|韩|kr"
    url: "https://www.gstatic.com/generate_204"
    interval: 180
    timeout: 2500
    tolerance: 50
    lazy: true
    max-failed-times: 2
    expected-status: 204

  - name: APPLE
    type: select
    proxies: [DIRECT, PROXY, AUTO, APAC-AUTO]

  - name: GOOGLE
    type: select
    proxies: [PROXY, AUTO, APAC-AUTO, DIRECT]

  - name: TELEGRAM
    type: select
    proxies: [PROXY, AUTO, APAC-AUTO]

  - name: FINAL
    type: select
    proxies: [PROXY, AUTO, APAC-AUTO, DIRECT]

# ============================================================
#  分流规则（白名单模式：未命中规则的流量走代理）
# ============================================================
rules:
  - RULE-SET,applications,DIRECT
  - DOMAIN,clash.razord.top,DIRECT
  - DOMAIN,yacd.haishan.me,DIRECT
  - RULE-SET,private,DIRECT
  - RULE-SET,reject,REJECT
  - RULE-SET,icloud,APPLE
  - RULE-SET,apple,APPLE
  - RULE-SET,google,GOOGLE
  - RULE-SET,telegramcidr,TELEGRAM
  - RULE-SET,proxy,PROXY
  - RULE-SET,direct,DIRECT
  - RULE-SET,lancidr,DIRECT
  - RULE-SET,cncidr,DIRECT
  - GEOIP,LAN,DIRECT
  - GEOIP,CN,DIRECT
  - MATCH,FINAL
