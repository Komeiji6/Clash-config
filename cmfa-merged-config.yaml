# ============================================================
# Komeiji6/Clash-config 主配置文件 (适用于 Mihomo / CMFA / Clash Verge)
# 节点直接内嵌直出（零 proxy-providers 二级套娃），规则外挂分流
# ============================================================

# ==================== 基础设置 ====================
mixed-port: 7890
allow-lan: true
bind-address: "*"
mode: rule
log-level: info
ipv6: false                        # 免费节点大多不支持 IPv6，关闭可防泄露和断流
unified-delay: true                # 统一延迟计算，去除握手额外耗时影响
tcp-concurrent: true               # 开启 TCP 并发连接，提升切节点和首次加载速度
find-process-mode: strict
# global-client-fingerprint removed in modern mihomo

profile:
  store-selected: true             # 记住手动选择的策略组节点
  store-fake-ip: true              # 缓存 Fake-IP 映射，减少重启后的连接中断

# ==================== 域名嗅探 (配合 Fake-IP 防止分流失效) ====================
sniffer:
  enable: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

# ==================== DNS 设置 (DoH + Fake-IP) ====================
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "localhost.ptlogin2.qq.com"
    - "+.srv.nintendo.net"
    - "+.stun.playstation.net"
    - "xbox.*.microsoft.com"
    - "+.xboxlive.com"
    - "time.*.com"
    - "time.*.gov"
    - "time.*.edu.cn"
    - "time.*.apple.com"
    - "ntp.*.com"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "connectivitycheck.gstatic.com"
    - "captive.apple.com"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fallback:
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4
      - 0.0.0.0/32

