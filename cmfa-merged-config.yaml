  - +.xboxlive.com
  - time.*.com
  - time.*.gov
  - time.*.edu.cn
  - time.*.apple.com
  - ntp.*.com
  - +.msftconnecttest.com
  - +.msftncsi.com
  - connectivitycheck.gstatic.com
  - captive.apple.com
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  proxy-server-nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  fallback:
  - https://dns.google/dns-query
  - https://cloudflare-dns.com/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
    - 240.0.0.0/4
    - 0.0.0.0/32
