name: Update Filtered Nodes

on:
  schedule:
    # 每天 UTC 02:27, 10:27, 18:27 运行（北京时间 10:27, 18:27, 02:27）
    - cron: '27 2,10,18 * * *'
  workflow_dispatch:

concurrency:
  group: update-nodes
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  filter-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Cache clash-speedtest binary
        id: cache-tool
        uses: actions/cache@v4
        with:
          path: ~/go/bin/clash-speedtest
          key: clash-speedtest-v1.8.8

      - name: Install clash-speedtest
        if: steps.cache-tool.outputs.cache-hit != 'true'
        run: go install github.com/faceair/clash-speedtest@v1.8.8

      - name: Cache mihomo binary
        id: cache-mihomo
        uses: actions/cache@v4
        with:
          path: ~/bin/mihomo
          key: mihomo-linux-amd64-v1

      - name: Install mihomo
        if: steps.cache-mihomo.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/bin
          python3 - << 'EOF'
          import gzip, json, os, re, urllib.request
          req = urllib.request.Request(
              "https://api.github.com/repos/MetaCubeX/mihomo/releases/latest",
              headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json"}
          )
          with urllib.request.urlopen(req, timeout=20) as resp:
              rel = json.load(resp)
          assets = rel.get("assets", [])
          patterns = [
              r"^mihomo-linux-amd64-compatible-v[\d.]+\.gz$",
              r"^mihomo-linux-amd64-v1-v[\d.]+\.gz$",
              r"^mihomo-linux-amd64-v[\d.]+\.gz$",
              r"^mihomo-linux-amd64-.*\.gz$",
          ]
          url = None
          for pat in patterns:
              for a in assets:
                  name = a.get("name", "")
                  if re.match(pat, name) and "alpha" not in name and "go120" not in name:
                      url = a["browser_download_url"]
                      break
              if url:
                  break
          if not url:
              raise RuntimeError("Could not find mihomo linux-amd64 asset")
          with urllib.request.urlopen(url, timeout=60) as r:
              raw = gzip.decompress(r.read())
          out_path = os.path.expanduser("~/bin/mihomo")
          with open(out_path, "wb") as f:
              f.write(raw)
          os.chmod(out_path, 0o755)
          print("Installed mihomo:", rel.get("tag_name"))
          EOF

      - name: Fetch Upstream & Prepare Env
        id: fetch
        run: |
          mkdir -p work
          curl -fsSL --retry 3 --max-time 30 \
            "https://raw.githubusercontent.com/VPN-Subcription-Links/ClashX-V2Ray-TopFreeProxy/main/combine/clash.config.yaml" \
            -o work/upstream1.yaml || \
          curl -fsSL --retry 2 --max-time 30 \
            "https://cdn.jsdelivr.net/gh/VPN-Subcription-Links/ClashX-V2Ray-TopFreeProxy@main/combine/clash.config.yaml" \
            -o work/upstream1.yaml || true

          if [ ! -s work/upstream1.yaml ] || [ $(wc -c < work/upstream1.yaml) -lt 10240 ]; then
            echo "Upstream fetch failed or file too small (<10KB). Skipping update safely."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q pyyaml
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Stage 1 - Fast Pre-filter (<=500ms, Top 600 Candidates)
        if: steps.fetch.outputs.ok == 'true'
        run: |
          cat << 'EOF' > work/split.py
          import json, math, os, re, yaml

          with open("work/upstream1.yaml", "r", encoding="utf-8", errors="ignore") as f:
              data = yaml.safe_load(f) or {}

          proxies = data.get("proxies") or []
          seen = set()
          clean = []
          name_counts = {}
          id_to_name = {}

          for p in proxies:
              if not isinstance(p, dict):
                  continue
              ptype = str(p.get("type", "")).lower()
              if ptype in ("http", "socks5"):
                  continue
              srv, port = p.get("server"), p.get("port")
              if not srv or not port:
                  continue
              key = (str(srv), str(port), ptype, str(p.get("uuid", p.get("password", ""))))
              if key in seen:
                  continue
              seen.add(key)

              base_name = re.sub(r"[\t\r\n]+", " ", str(p.get("name") or "Node")).strip() or "Node"
              cnt = name_counts.get(base_name, 0) + 1
              name_counts[base_name] = cnt
              final_name = base_name if cnt == 1 else f"{base_name} #{cnt}"

              node_id = f"N{len(clean):05d}"
              id_to_name[node_id] = final_name

              p_copy = dict(p)
              p_copy["name"] = node_id
              clean.append(p_copy)

          with open("work/id_to_name.json", "w", encoding="utf-8") as nf:
              json.dump(id_to_name, nf, ensure_ascii=False)

          with open("work/stats_raw.txt", "w") as sf:
              sf.write(f"{len(proxies)} {len(clean)}\n")

          if not clean:
              raise SystemExit(0)

          os.makedirs("work/chunks", exist_ok=True)
          chunks = 20
          size = max(1, math.ceil(len(clean) / chunks))
          for i in range(0, len(clean), size):
              idx = i // size
              with open(f"work/chunks/part_{idx:02d}.yaml", "w", encoding="utf-8") as out:
                  yaml.safe_dump({"proxies": clean[i:i+size]}, out, allow_unicode=True, sort_keys=False)
          EOF

          /tmp/venv/bin/python work/split.py

          mkdir -p work/out work/homes
          if ls work/chunks/part_*.yaml >/dev/null 2>&1; then
            export TOOL="$(go env GOPATH)/bin/clash-speedtest"
            ls work/chunks/part_*.yaml | xargs -n 1 -P 20 -I {} bash -c '
              in_file="$1"
              base=$(basename "$in_file")
              home_dir="work/homes/${base%.yaml}"
              mkdir -p "$home_dir"
              HOME="$home_dir" "$TOOL" \
                -c "$in_file" \
                -fast \
                -rename="false" \
                -min-download-speed 0 \
                -timeout 1500ms \
                -max-latency 500ms \
                -output "work/out/$base" > "work/out/${base}.log" 2>&1 || true
            ' _ {}
          fi

          cat << 'EOF' > work/pick_candidates.py
          import glob, re, yaml

          CAND_LIMIT = 600
          ANSI_RE = re.compile(r"\x1b\[[0-9;]*[a-zA-Z]")
          DUR_RE = re.compile(r"^(\d+(?:\.\d+)?)(ms|s)$")
          ID_RE = re.compile(r"\b(N\d{4,})\b")

          lat_map = {}
          for log_path in sorted(glob.glob("work/out/part_*.yaml.log")):
              with open(log_path, "r", encoding="utf-8", errors="ignore") as lf:
                  for raw_line in lf:
                      line = ANSI_RE.sub("", raw_line).strip()
                      if not line:
                          continue
                      m_id = ID_RE.search(line)
                      if not m_id:
                          continue
                      nid = m_id.group(1)
                      parts = [c.strip() for c in line.split("\t") if c.strip()]
                      lat_ms = None
                      if nid in parts:
                          idx = parts.index(nid)
                          for cell in parts[idx + 1:]:
                              m_dur = DUR_RE.match(cell)
                              if m_dur:
                                  val = float(m_dur.group(1))
                                  lat_ms = val * 1000.0 if m_dur.group(2) == "s" else val
                                  break
                      if lat_ms is None:
                          m_fb = re.search(rf"\b{nid}\b\s+\S+\s+(\d+(?:\.\d+)?)(ms|s)\b", line)
                          if m_fb:
                              val = float(m_fb.group(1))
                              lat_ms = val * 1000.0 if m_fb.group(2) == "s" else val
                      if lat_ms is not None:
                          lat_map[nid] = lat_ms

          all_live = []
          for path in sorted(glob.glob("work/out/part_*.yaml")):
              with open(path, "r", encoding="utf-8", errors="ignore") as f:
                  data = yaml.safe_load(f) or {}
              for p in (data.get("proxies") or []):
                  if not isinstance(p, dict) or not p.get("server"):
                      continue
                  nid = str(p.get("name") or "")
                  lat = lat_map.get(nid, 999999.0)
                  all_live.append((lat, p))

          all_live.sort(key=lambda x: x[0])
          cands = [item[1] for item in all_live[:CAND_LIMIT]]

          with open("work/stage1_candidates.yaml", "w", encoding="utf-8") as out:
              yaml.safe_dump({"proxies": cands}, out, allow_unicode=True, sort_keys=False)

          with open("work/stats_s1.txt", "w") as sf:
              sf.write(f"{len(all_live)} {len(cands)}\n")
          EOF

          /tmp/venv/bin/python work/pick_candidates.py

      - name: Stage 2 & 3 - External Web Access Check & Keep Fastest 50
        if: steps.fetch.outputs.ok == 'true'
        run: |
          cat << 'EOF' > work/verify_stage2.py
          import concurrent.futures, json, os, subprocess, time, urllib.parse, urllib.request, yaml

          with open("work/stage1_candidates.yaml", "r", encoding="utf-8") as f:
              cands = (yaml.safe_load(f) or {}).get("proxies") or []

          if not cands:
              with open("work/stage2_passed.yaml", "w", encoding="utf-8") as out:
                  yaml.safe_dump({"proxies": []}, out)
              with open("work/stage2_lats.json", "w", encoding="utf-8") as lf:
                  json.dump({}, lf)
              with open("work/stats_s2.txt", "w") as sf:
                  sf.write("0\n")
              raise SystemExit(0)

          os.makedirs("work/mihomo_home", exist_ok=True)
          verify_cfg = {
              "mixed-port": 17890,
              "allow-lan": False,
              "mode": "rule",
              "log-level": "error",
              "external-controller": "127.0.0.1:19090",
              "ipv6": False,
              "dns": {
                  "enable": True,
                  "listen": "127.0.0.1:1053",
                  "nameserver": ["8.8.8.8", "1.1.1.1"],
              },
              "proxies": cands,
              "rules": ["MATCH,DIRECT"],
          }
          with open("work/verify.yaml", "w", encoding="utf-8") as vf:
              yaml.safe_dump(verify_cfg, vf, allow_unicode=True, sort_keys=False)

          mihomo_bin = os.path.expanduser("~/bin/mihomo")
          log_f = open("work/mihomo.log", "w", encoding="utf-8")
          proc = subprocess.Popen(
              [mihomo_bin, "-d", "work/mihomo_home", "-f", "work/verify.yaml"],
              stdout=log_f,
              stderr=subprocess.STDOUT,
          )

          # 必须同时通过 YouTube + Google 搜索 + Cloudflare，且严格校验 HTTP 状态码，连不上外网一律杀掉
          TARGETS = [
              ("https://www.youtube.com/generate_204", "204"),
              ("https://www.google.com/robots.txt", "200"),
              ("https://cp.cloudflare.com/generate_204", "204"),
          ]

          passed = []
          lat_scores = {}
          try:
              ready = False
              for _ in range(40):
                  if proc.poll() is not None:
                      break
                  try:
                      with urllib.request.urlopen("http://127.0.0.1:19090/version", timeout=1) as r:
                          if r.status == 200:
                              ready = True
                              break
                  except Exception:
                      time.sleep(0.5)

              if not ready:
                  raise RuntimeError("mihomo failed to start cleanly")

              def check_one(p):
                  nid = p["name"]
                  delays = []
                  for target_url, expected in TARGETS:
                      q = urllib.parse.urlencode({"url": target_url, "timeout": 3500, "expected": expected})
                      api = f"http://127.0.0.1:19090/proxies/{urllib.parse.quote(nid, safe='')}/delay?{q}"
                      try:
                          with urllib.request.urlopen(api, timeout=5) as resp:
                              data = json.load(resp)
                              d = float(data.get("delay", 0))
                              if d <= 0:
                                  return None
                              delays.append(d)
                      except Exception:
                          return None
                  return (nid, sum(delays) / len(delays), p)

              with concurrent.futures.ThreadPoolExecutor(max_workers=32) as ex:
                  for res in ex.map(check_one, cands):
                      if res is not None:
                          nid, avg_lat, p = res
                          lat_scores[nid] = avg_lat
                          passed.append(p)
          finally:
              proc.terminate()
              try:
                  proc.wait(timeout=5)
              except Exception:
                  proc.kill()
              log_f.close()

          passed.sort(key=lambda p: lat_scores.get(p["name"], 9999.0))

          with open("work/stage2_passed.yaml", "w", encoding="utf-8") as out:
              yaml.safe_dump({"proxies": passed}, out, allow_unicode=True, sort_keys=False)
          with open("work/stage2_lats.json", "w", encoding="utf-8") as lf:
              json.dump(lat_scores, lf)
          with open("work/stats_s2.txt", "w") as sf:
              sf.write(f"{len(passed)}\n")
          EOF

          /tmp/venv/bin/python work/verify_stage2.py

          cat << 'EOF' > work/split_s3.py
          import math, os, yaml

          with open("work/stage2_passed.yaml", "r", encoding="utf-8") as f:
              s2 = (yaml.safe_load(f) or {}).get("proxies") or []

          # 取第 2 关外网延迟最低的前 200 个做 64KB 真实拉流核验
          s2 = s2[:200]
          os.makedirs("work/s3_chunks", exist_ok=True)
          if s2:
              chunks = min(4, len(s2))
              size = max(1, math.ceil(len(s2) / chunks))
              for i in range(0, len(s2), size):
                  idx = i // size
                  with open(f"work/s3_chunks/part_{idx:02d}.yaml", "w", encoding="utf-8") as out:
                      yaml.safe_dump({"proxies": s2[i:i+size]}, out, allow_unicode=True, sort_keys=False)
          EOF

          /tmp/venv/bin/python work/split_s3.py

          mkdir -p work/s3_out work/s3_homes
          if ls work/s3_chunks/part_*.yaml >/dev/null 2>&1; then
            export TOOL="$(go env GOPATH)/bin/clash-speedtest"
            ls work/s3_chunks/part_*.yaml | xargs -n 1 -P 4 -I {} bash -c '
              in_file="$1"
              base=$(basename "$in_file")
              home_dir="work/s3_homes/${base%.yaml}"
              mkdir -p "$home_dir"
              HOME="$home_dir" "$TOOL" \
                -c "$in_file" \
                -speed-mode download \
                -download-size 65536 \
                -rename="false" \
                -min-download-speed 0.05 \
                -timeout 4000ms \
                -max-latency 800ms \
                -concurrent 4 \
                -output "work/s3_out/$base" > "work/s3_out/${base}.log" 2>&1 || true
            ' _ {}
          fi

          cat << 'EOF' > work/finalize_top50.py
          import glob, json, os, yaml

          MAX_NODES = 50

          id_to_name = {}
          if os.path.exists("work/id_to_name.json"):
              with open("work/id_to_name.json", "r", encoding="utf-8") as nf:
                  id_to_name = json.load(nf)

          lat_scores = {}
          if os.path.exists("work/stage2_lats.json"):
              with open("work/stage2_lats.json", "r", encoding="utf-8") as lf:
                  lat_scores = json.load(lf)

          survivors = []
          for path in sorted(glob.glob("work/s3_out/part_*.yaml")):
              with open(path, "r", encoding="utf-8", errors="ignore") as f:
                  data = yaml.safe_load(f) or {}
              for p in (data.get("proxies") or []):
                  if not isinstance(p, dict) or not p.get("server"):
                      continue
                  nid = str(p.get("name") or "")
                  p["name"] = id_to_name.get(nid, nid)
                  avg_lat = float(lat_scores.get(nid, 9999.0))
                  survivors.append((avg_lat, p))

          survivors.sort(key=lambda x: x[0])
          chosen = survivors[:MAX_NODES]
          top_proxies = [p for _, p in chosen]

          lats = [lat for lat, _ in chosen if lat < 9999.0]
          lat_min = f"{min(lats):.0f}ms" if lats else "-"
          lat_max = f"{max(lats):.0f}ms" if lats else "-"

          with open("work/proxies.yaml", "w", encoding="utf-8") as out:
              yaml.safe_dump({"proxies": top_proxies}, out, allow_unicode=True, sort_keys=False)

          with open("work/stats_live.txt", "w") as sf:
              sf.write(f"{len(survivors)} {len(top_proxies)} {lat_min} {lat_max}\n")
          EOF

          /tmp/venv/bin/python work/finalize_top50.py

      - name: Validate & Publish to 'nodes' Branch
        if: steps.fetch.outputs.ok == 'true'
        run: |
          read RAW_COUNT DEDUP_COUNT < work/stats_raw.txt
          read S1_LIVE S1_CAND < work/stats_s1.txt
          read S2_PASSED < work/stats_s2.txt
          read S3_PASSED KEPT_COUNT LAT_MIN LAT_MAX < work/stats_live.txt

          echo "### 节点外网实测精选报表（全外网通过 + 最快前 50）" >> "$GITHUB_STEP_SUMMARY"
          echo "| 阶段 | 数量 / 说明 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| :--- | :--- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 原始节点数 | ${RAW_COUNT} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 去重后加密节点数（已剔除 http/socks5） | ${DEDUP_COUNT} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 第 1 关：<=500ms 初筛 | ${S1_LIVE}（取最快 ${S1_CAND} 进外网验身） |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 第 2 关：YouTube + Google + CF 三站全通 | ${S2_PASSED} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 第 3 关：64KB 真实拉流 (>=50KB/s) 通过 | ${S3_PASSED} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **最终保留（外网延迟最低 Top 50）** | **${KEPT_COUNT}（外网均延迟 ${LAT_MIN} ~ ${LAT_MAX}）** |" >> "$GITHUB_STEP_SUMMARY"

          if [ "$KEPT_COUNT" -lt 3 ]; then
            echo "状态：通过外网校验的节点不足 3 个（当前 ${KEPT_COUNT} 个），已跳过本次覆盖以保护旧节点。" >> "$GITHUB_STEP_SUMMARY"
            tail -n 30 work/mihomo.log || true
            exit 0
          fi

          mkdir -p out_repo
          cp work/proxies.yaml out_repo/proxies.yaml
          cat <<EOF > out_repo/README.md
          # Filtered Nodes Status
          - Last Updated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          - Raw Nodes: ${RAW_COUNT}
          - Deduplicated: ${DEDUP_COUNT}
          - Stage 1 (<=500ms): ${S1_LIVE} (Candidates: ${S1_CAND})
          - Stage 2 (YouTube + Google + Cloudflare Verified): ${S2_PASSED}
          - Stage 3 (64KB Transfer >=50KB/s): ${S3_PASSED}
          - Kept Top Nodes: ${KEPT_COUNT} (Verified External Web Latency: ${LAT_MIN} ~ ${LAT_MAX})
          - Note: Non-commercial personal connectivity filtering only.
          EOF

          cd out_repo
          git init -b nodes
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add proxies.yaml README.md
          git commit -m "chore: update top ${KEPT_COUNT} external-web-verified nodes (${LAT_MIN}~${LAT_MAX})"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push --force origin nodes

          echo "状态：✅ 已成功发布至 \`nodes\` 分支。" >> "$GITHUB_STEP_SUMMARY"
